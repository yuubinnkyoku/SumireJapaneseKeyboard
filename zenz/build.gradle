plugins {
    id 'com.android.library'
}

def localProperties = new Properties()
def localPropertiesFile = rootProject.file("local.properties")
if (localPropertiesFile.exists()) {
    localProperties.load(new FileInputStream(localPropertiesFile))
}

def zenzModelRepo = providers.gradleProperty("zenzModelRepo")
        .orElse(localProperties.getProperty("zenzModelRepo") ?: "Miwa-Keita/zenz-v3.2-xsmall-gguf")
        .get()
def zenzModelRevision = providers.gradleProperty("zenzModelRevision")
        .orElse(localProperties.getProperty("zenzModelRevision") ?: "4f5423f0fad41a73b1242eb96fe5c12ae4fdca83")
        .get()
def zenzModelQuantization = providers.gradleProperty("zenzModelQuantization")
        .orElse(localProperties.getProperty("zenzModelQuantization") ?: "Q5_K_M")
        .get()
def zenzModelAssetName = providers.gradleProperty("zenzModelAssetName")
        .orElse(localProperties.getProperty("zenzModelAssetName") ?: "ggml-model-Q5_K_M.gguf")
        .get()
def zenzModelHfToken = providers.gradleProperty("zenzModelHfToken")
        .orElse(localProperties.getProperty("zenzModelHfToken") ?: System.getenv("HF_TOKEN") ?: "")
        .get()
def defaultZenzModelCacheDir = rootProject.layout.projectDirectory.dir(".gradle/zenz-model-cache").asFile.absolutePath
def zenzModelCacheDir = providers.gradleProperty("zenzModelCacheDir")
        .orElse(localProperties.getProperty("zenzModelCacheDir") ?: System.getenv("ZENZ_MODEL_CACHE_DIR") ?: defaultZenzModelCacheDir)
        .get()
def generatedZenzAssetsDir = layout.buildDirectory.dir("generated/assets/zenzModel/main")
def zenzDebugNativeAbis = providers.gradleProperty("zenzDebugNativeAbis")
        .orElse(localProperties.getProperty("zenzDebugNativeAbis") ?: System.getenv("ZENZ_DEBUG_NATIVE_ABIS") ?: "arm64-v8a")
        .get()
        .split(",")
        .collect { it.trim() }
        .findAll { it }
def zenzReleaseNativeAbis = providers.gradleProperty("zenzReleaseNativeAbis")
        .orElse(localProperties.getProperty("zenzReleaseNativeAbis") ?: System.getenv("ZENZ_RELEASE_NATIVE_ABIS") ?: "arm64-v8a,armeabi-v7a,x86,x86_64")
        .get()
        .split(",")
        .collect { it.trim() }
        .findAll { it }
def zenzDebugOptimizedNative = providers.gradleProperty("zenzDebugOptimizedNative")
        .orElse(localProperties.getProperty("zenzDebugOptimizedNative") ?: System.getenv("ZENZ_DEBUG_OPTIMIZED_NATIVE") ?: "false")
        .get()
        .toBoolean()

// -------------------------------------------------------------------
// NPU (Hexagon) 設定: 既定はOFF。ONにするときはzenzHexagonSdkRootが必須。
// skel(libggml-htp-*.so)とDSP側libomp.soは事前ビルドのものを使うため、
// zenzHexagonPrebuiltDirに置いたファイルをjniLibsへコピーする。
// 例: gradle.propertiesやlocal.propertiesに
//   zenzNpuEnabled=true
//   zenzHexagonSdkRoot=C\:\\Qualcomm\\HexagonSDK\\5.x.x
//   zenzHexagonPrebuiltDir=D\:/path/to/prebuilt-htp-libs
// -------------------------------------------------------------------
def zenzNpuEnabled = providers.gradleProperty("zenzNpuEnabled")
        .orElse(localProperties.getProperty("zenzNpuEnabled") ?: "false")
        .get()
        .toBoolean()
def zenzHexagonSdkRoot = providers.gradleProperty("zenzHexagonSdkRoot")
        .orElse(localProperties.getProperty("zenzHexagonSdkRoot") ?: "")
        .get()
def zenzHexagonToolsRoot = providers.gradleProperty("zenzHexagonToolsRoot")
        .orElse(localProperties.getProperty("zenzHexagonToolsRoot") ?: "")
        .get()
def zenzHexagonPrebuiltDir = providers.gradleProperty("zenzHexagonPrebuiltDir")
        .orElse(localProperties.getProperty("zenzHexagonPrebuiltDir") ?: "")
        .get()

def zenzNpuCmakeArgs = []
if (zenzNpuEnabled) {
    if (!zenzHexagonSdkRoot) {
        throw new GradleException("zenzNpuEnabled=true requires zenzHexagonSdkRoot (Hexagon SDK install path).")
    }
    if (!zenzHexagonPrebuiltDir) {
        throw new GradleException("zenzNpuEnabled=true requires zenzHexagonPrebuiltDir (directory containing libggml-htp-*.so and the DSP-side libomp.so).")
    }
    zenzNpuCmakeArgs += [
            "-DZENZ_ENABLE_NPU=ON",
            "-DGGML_HEXAGON=ON",
            "-DGGML_HEXAGON_HTP_SKEL=OFF",
            "-DHEXAGON_SDK_ROOT=${zenzHexagonSdkRoot}",
            "-DPREBUILT_LIB_DIR=toolv19_v81"
    ]
    if (zenzHexagonToolsRoot) {
        zenzNpuCmakeArgs += "-DHEXAGON_TOOLS_ROOT=${zenzHexagonToolsRoot}"
    }
}

// Round 19 measurement hook. Enable with -PzenzLogitDump=true.
def zenzLogitDump = providers.gradleProperty("zenzLogitDump").orNull == "true"
if (zenzLogitDump) {
    zenzNpuCmakeArgs += "-DZENZ_LOGIT_DUMP=ON"
}

// skelを格納するjniLibsの生成先。arm64-v8a決め打ち(NPU搭載端末はarm64のみ)。
def zenzNpuJniLibsRoot = layout.buildDirectory.dir("generated/zenzNpuJniLibs")

android {
    namespace 'com.kazumaproject.zenz'
    compileSdk = 37

    ndkVersion "29.0.14206865"

    defaultConfig {
        minSdk 24
        targetSdk 36
        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
        consumerProguardFiles "consumer-rules.pro"
    }

    buildTypes {
        debug {
            ndk {
                abiFilters(*zenzDebugNativeAbis)
            }
            externalNativeBuild {
                cmake {
                    arguments "-DZENZ_NATIVE_OPTIMIZED=${zenzDebugOptimizedNative ? 'ON' : 'OFF'}", *zenzNpuCmakeArgs
                }
            }
        }
        release {
            ndk {
                abiFilters(*zenzReleaseNativeAbis)
            }
            externalNativeBuild {
                cmake {
                    arguments "-DZENZ_NATIVE_OPTIMIZED=ON", *zenzNpuCmakeArgs
                }
            }
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }

    // CMake でネイティブライブラリをビルドする設定（維持）
    externalNativeBuild {
        cmake {
            path "src/main/cpp/CMakeLists.txt"
        }
    }

    // Javaバージョンをターゲットフォーマットの "17" に統一
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    // ViewBinding等の機能を有効化
    buildFeatures {
        viewBinding true
    }

    sourceSets {
        main {
            assets.srcDirs = [generatedZenzAssetsDir.get().asFile]
            if (zenzNpuEnabled) {
                // 事前ビルドのHTP skelをAPKのnativeLibraryDirに同梱する
                jniLibs.srcDirs += [zenzNpuJniLibsRoot.get().asFile]
            }
        }
    }

    if (zenzNpuEnabled) {
        packaging {
            jniLibs {
                // Hexagon向けバイナリ(DSP側ELF)はAndroidのstrip対象から外す
                keepDebugSymbols += ["**/libggml-htp-*.so", "**/libomp.so"]
                // DSP loader needs a real file path, not an APK entry
                useLegacyPackaging = true
            }
        }
    }
}

def prepareZenzModel = tasks.register("prepareZenzModel", Exec) {
    group = "zenz"
    description = "Downloads the Zenz GGUF model from Hugging Face for packaging."

    def outputDir = generatedZenzAssetsDir.get().asFile

    inputs.property("repo", zenzModelRepo)
    inputs.property("revision", zenzModelRevision)
    inputs.property("quantization", zenzModelQuantization)
    inputs.property("assetName", zenzModelAssetName)
    outputs.file(new File(outputDir, zenzModelAssetName))

    commandLine "bash", "${project.projectDir}/scripts/prepare_zenz_model.sh"
    environment "ZENZ_MODEL_REPO", zenzModelRepo
    environment "ZENZ_MODEL_REVISION", zenzModelRevision
    environment "ZENZ_MODEL_QUANTIZATION", zenzModelQuantization
    environment "ZENZ_MODEL_ASSET_NAME", zenzModelAssetName
    environment "ZENZ_MODEL_OUTPUT_DIR", outputDir.absolutePath
    environment "ZENZ_MODEL_WORK_DIR", layout.buildDirectory.dir("intermediates/zenzModel").get().asFile.absolutePath
    environment "ZENZ_MODEL_HF_TOKEN", zenzModelHfToken
    environment "ZENZ_LLAMA_CPP_DIR", file("src/main/cpp/llama.cpp").absolutePath
    if (zenzModelCacheDir) {
        environment "ZENZ_MODEL_CACHE_DIR", zenzModelCacheDir
    }
}

def prepareZenzNpuLibs = tasks.register("prepareZenzNpuLibs", Copy) {
    group = "zenz"
    description = "Copies prebuilt Hexagon HTP skel libraries into the APK's jniLibs."

    from(file(zenzHexagonPrebuiltDir)) {
        include "libggml-htp-*.so", "libomp.so"
    }
    into new File(zenzNpuJniLibsRoot.get().asFile, "arm64-v8a")
}

tasks.named("preBuild").configure {
    dependsOn(prepareZenzModel)
    if (zenzNpuEnabled) {
        dependsOn(prepareZenzNpuLibs)
    }
}

dependencies {
    implementation 'androidx.core:core-ktx:1.17.0'
    implementation 'androidx.appcompat:appcompat:1.7.1'
    implementation 'com.google.android.material:material:1.13.0'

    testImplementation 'junit:junit:4.13.2'
    androidTestImplementation 'androidx.test.ext:junit:1.3.0'
    androidTestImplementation 'androidx.test.espresso:espresso-core:3.7.0'
}
